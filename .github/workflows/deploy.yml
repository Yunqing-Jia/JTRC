name: Deploy to GitHub Pages

on:
  push:
    branches: [main]        
  workflow_dispatch:        

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Inject CARTO API key
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          if [ -z "$CARTO_API_KEY" ]; then
            echo "::error:: no secret called CARTO_API_KEY"
            exit 1
          fi
          mapfile -t files < <(grep -rl --exclude-dir=.git --exclude-dir=.github '__CARTO_API_KEY__' . || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no __CARTO_API_KEY__ in code"
            exit 1
          fi
          sed -i "s|__CARTO_API_KEY__|${CARTO_API_KEY}|g" "${files[@]}"
          echo "already key:${files[*]}"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _includes/transportationmap.html.      

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
